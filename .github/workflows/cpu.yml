name: CPU serving verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . -c requirements-verified.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/verify_serving.py --device cpu --output evidence/cpu-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-serving-evidence
          path: evidence/cpu-runtime.json
          if-no-files-found: warn
